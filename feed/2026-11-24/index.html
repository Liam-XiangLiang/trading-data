let i = 0;
const $ = id => document.getElementById(id);
const strip = $('strip');
CARDS.forEach((c, k) => { const b = document.createElement('button'); b.textContent = c.short; b.onclick = () => go(k); strip.appendChild(b); });
function chip(el, v) { el.textContent = v || '—'; el.className = 'chip ' + (v ? ('123'.includes(v) ? 'up' : 'dn') : 'na'); }
function go(k) {
  i = Math.max(0, Math.min(CARDS.length - 1, k));
  const c = CARDS[i];
  $('img').src = c.src; $('img').alt = c.tv;
  $('sym').textContent = c.short;
  chip($('wW'), c.waves.W); chip($('wD'), c.waves.D); chip($('wH'), c.waves.H);
  $('count').textContent = (i + 1) + ' / ' + CARDS.length;
  [...strip.children].forEach((b, k2) => b.classList.toggle('on', k2 === i));
  strip.children[i].scrollIntoView({inline: 'center', block: 'nearest'});
  [i - 1, i + 1].forEach(k2 => { if (CARDS[k2]) { const p = new Image(); p.src = CARDS[k2].src; } });
}

const stage = $('stage');
